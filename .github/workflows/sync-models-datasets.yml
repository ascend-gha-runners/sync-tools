name: sync models and datasets

on:
  workflow_dispatch:
    inputs:
      project:
        description: "只同步指定项目（留空=全部）"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/config/projects-clusters.json"
      - ".github/workflows/config/projects/**"
      - ".github/workflows/sync-models-datasets.yml"
      - ".github/scripts/build-sync-matrix.sh"
      - ".github/scripts/download-json-models.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/config/projects-clusters.json"
      - ".github/workflows/config/projects/**"
      - ".github/workflows/sync-models-datasets.yml"
      - ".github/scripts/build-sync-matrix.sh"
      - ".github/scripts/download-json-models.sh"

concurrency:
  group: sync-models-datasets-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    # Self-hosted runners must never execute code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      arc-matrix: ${{ steps.split.outputs.arc-matrix }}
      host-matrix: ${{ steps.split.outputs.host-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 2 }}
      - name: Build matrix
        id: gen
        env:
          INPUT_PROJECT: ${{ inputs.project }}
        run: bash .github/scripts/build-sync-matrix.sh | tee /tmp/matrix.log

      - name: Split cluster/machine runners
        id: split
        run: |
          MATRIX='${{ steps.gen.outputs.matrix }}'
          echo "$MATRIX" | jq -c '[.[] | select(.cluster | startswith("model-sync-") | not)]' > /tmp/arc.json
          echo "$MATRIX" | jq -c '[.[] | select(.cluster | startswith("model-sync-"))]' > /tmp/host.json
          echo "arc-matrix=$(cat /tmp/arc.json)" >> "$GITHUB_OUTPUT"
          echo "host-matrix=$(cat /tmp/host.json)" >> "$GITHUB_OUTPUT"
          {
            echo "#### Selected sync targets"
            echo '```json'
            jq . /tmp/matrix.log 2>/dev/null || cat /tmp/matrix.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.arc-matrix != '[]'
    name: sync ${{ matrix.project }} to ${{ matrix.cluster }}
    runs-on: ${{ matrix.cluster }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.arc-matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/sync-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Split project config into models/datasets
        run: |
          CFG=".github/workflows/config/projects/${{ matrix.project }}.json"
          jq '.models   // []' "$CFG" > /tmp/models.json
          jq '.datasets // []' "$CFG" > /tmp/datasets.json
          echo "models count: $(jq 'length' /tmp/models.json)"
          echo "datasets count: $(jq 'length' /tmp/datasets.json)"

      - name: Download models
        run: |
          if [ "$(jq 'length' /tmp/models.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/models.json model
          else
            echo "No models for ${{ matrix.project }}, skip"
          fi

      - name: Download datasets
        run: |
          if [ "$(jq 'length' /tmp/datasets.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/datasets.json dataset
          else
            echo "No datasets for ${{ matrix.project }}, skip"
          fi

  # model-sync-* labels are dedicated rsync/sync ECS machines (no docker, no
  # cluster network contention). Jobs run directly on the host; per-machine
  # cache locations come from /etc/profile.d/model-tools.sh on each box.
  sync-host:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.host-matrix != '[]'
    name: sync ${{ matrix.project }} on ${{ matrix.cluster }}
    runs-on: ${{ matrix.cluster }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.host-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure host tooling
        run: |
          command -v jq >/dev/null || { apt-get update -q && apt-get install -y -q jq; }
          command -v hf >/dev/null || pip3 install --break-system-packages -q -U huggingface_hub
          command -v modelscope >/dev/null || pip3 install --break-system-packages -q -U modelscope

      - name: Resolve cache env from host profile
        run: |
          # Per-label profile fragments let one machine serve several cluster
          # shares: /etc/profile.d/model-tools-<suffix>.sh overrides the
          # machine default (/etc/profile.d/model-tools.sh) when present.
          SUFFIX='${{ matrix.cluster }}'; SUFFIX="${SUFFIX#model-sync-}"
          bash -lc ". /etc/profile.d/model-tools.sh 2>/dev/null; [ -f /etc/profile.d/model-tools-$SUFFIX.sh ] && . /etc/profile.d/model-tools-$SUFFIX.sh; env | grep -E '^(HF_|HUGGINGFACE_|MODELSCOPE_)'" | tee -a "$GITHUB_ENV"

      - name: Split project config into models/datasets
        run: |
          CFG=".github/workflows/config/projects/${{ matrix.project }}.json"
          jq '.models   // []' "$CFG" > /tmp/models.json
          jq '.datasets // []' "$CFG" > /tmp/datasets.json
          echo "models count: $(jq 'length' /tmp/models.json)"
          echo "datasets count: $(jq 'length' /tmp/datasets.json)"

      - name: Download models
        run: |
          if [ "$(jq 'length' /tmp/models.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/models.json model
          else
            echo "No models for ${{ matrix.project }}, skip"
          fi

      - name: Download datasets
        run: |
          if [ "$(jq 'length' /tmp/datasets.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/datasets.json dataset
          else
            echo "No datasets for ${{ matrix.project }}, skip"
          fi
