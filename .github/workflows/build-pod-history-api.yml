name: Build pod-history-api image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Goalina/pod-history-api 分支或 tag（默认 main）'
        default: 'main'
        required: false

env:
  REGISTRY: swr.cn-southwest-2.myhuaweicloud.com
  IMAGE: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/pod-history-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pod-history-api
        uses: actions/checkout@v4
        with:
          repository: Goalina/pod-history-api
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.HWCLOUD_USER }}
          password: ${{ secrets.HWCLOUD_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          provenance: false
