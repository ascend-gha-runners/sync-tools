name: Sync vllm-ascend Images

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare sync matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          matrix=$(jq -c '[.[] | select(.src | test("^swr\\.cn-north-12\\..*vllm-ascend")) | .src] | unique | map({src: .})' .github/workflows/config/image-sync.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
        id: set-matrix

  sync:
    name: Sync ${{ matrix.src }}
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: quay.io/skopeo/stable:latest
    # 并发组与 sync-images.yml 主同步完全一致（sync-images-<src>）：两边写的是
    # 同一批 dest registry，同 src 必须跨 workflow 互斥。旧组名
    # sync-images-<github.ref> 只在本 workflow 内互斥，跟主同步的 per-src 组
    # 对不上，同 src 可并发互踩。
    concurrency:
      group: sync-images-${{ matrix.src }}
      cancel-in-progress: false
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: microdnf install -y jq curl

      - name: Restore digest cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/digest-cache
          # 与 sync-images.yml 主同步同一套 key 方案（# 分隔符 + 旧 `-` 格式回退），
          # 两个 workflow 共享同一缓存命名空间、写同一种格式，收敛 #153/#154 的
          # 迁移（也闭环 #155 遗留项「sync-vllm-ascend 同款缓存模式统一治理」）。
          key: digest-cache-${{ matrix.src }}#${{ github.run_id }}
          restore-keys: |
            digest-cache-${{ matrix.src }}#
            digest-cache-${{ matrix.src }}-

      - name: Sync ${{ matrix.src }} to all destinations
        env:
          QUAY_ASCEND_USER: ${{ vars.QUAY_ASCEND_USER }}
          QUAY_ASCEND_PWD: ${{ secrets.QUAY_ASCEND_PWD }}
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_PWD: ${{ secrets.DOCKERHUB_PWD }}
          DOCKERHUB_PAGE_CAP: ${{ vars.DOCKERHUB_PAGE_CAP }}
          HWCLOUD_USER: ${{ vars.HWCLOUD_USER }}
          HWCLOUD_PWD: ${{ secrets.HWCLOUD_PWD }}
          SWR_EAST3_USER: ${{ vars.SWR_EAST3_USER }}
          SWR_EAST3_SECRET: ${{ secrets.SWR_EAST3_SECRET }}
          SWR_HK_USER: ${{ vars.REGISTRY_HK_USER }}
          SWR_HK_SECRET: ${{ secrets.SWR_HK_SECRET }}
          SWR_NORTH12_USER: ${{ vars.SWR_NORTH12_USER }}
          SWR_NORTH12_SECRET: ${{ secrets.SWR_NORTH12_SECRET }}
          SWR_NORTH4_USER: ${{ vars.SWR_NORTH4_USER }}
          SWR_NORTH4_SECRET: ${{ secrets.SWR_NORTH4_SECRET }}
          QUAY_ATLAS_INFERENCE_USER: ${{ vars.QUAY_ATLAS_INFERENCE_USER }}
          QUAY_ATLAS_INFERENCE_PWD: ${{ secrets.QUAY_ATLAS_INFERENCE_PWD }}
          CURRENT_SRC: ${{ matrix.src }}
        timeout-minutes: 170
        run: bash .github/scripts/sync-images.sh

      - name: Save digest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/digest-cache
          key: digest-cache-${{ matrix.src }}#${{ github.run_id }}-${{ github.run_attempt }}
