name: model library

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "业务仓库（记录用，如 vllm-project/vllm-ascend）"
        required: true
        default: "vllm-project/vllm-ascend"
      runner_label:
        description: "你的 runner 标签（runs-on 那一行）——自动路由集群，如 *800i* → cn12+mind3+aiframe"
        required: true
      platform:
        description: "下载源"
        type: choice
        required: true
        default: modelscope
        options: [modelscope, huggingface]
      organization:
        description: "模型组织，如 Qwen / vllm-sr"
        required: true
      model_name:
        description: "模型名，如 d3-edge"
        required: true
      revision:
        description: "分支/commit（留空=默认）"
        required: false
        default: ""
      legacy_layout:
        description: "modelscope：额外平铺到 hub/models/<org>/<name> 旧布局"
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [model-download-request]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - "model-requests/requests.json"
      - ".github/scripts/lib-extract-new-requests.py"
      - "model-library/**"
      - ".github/workflows/model-library.yml"
      - ".github/scripts/lib-build-matrix.sh"
      - ".github/scripts/lib-resolve.sh"
      - ".github/scripts/download-json-models.sh"

concurrency:
  group: model-library-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.number) || github.event_name == 'repository_dispatch' && format('rd-{0}', github.event.client_payload.request_id || github.run_id) || format('dispatch-{0}-{1}-{2}', inputs.runner_label, inputs.organization, inputs.model_name) }}
  cancel-in-progress: false  # review: 下载任务不可取消，中途 cancel 会留下半截共享盘文件

jobs:
  plan:
    # PR(fork 亦可): 需 "model-download" 标签审批；本 workflow 与所有脚本
    # 固定取 base(main) 版本，fork 仅提供 requests.json 数据（plan 已做字段白名单）。
    # Dispatch: actor 需 write(committer) 及以上。
    if: >-
      github.event_name != 'pull_request_target' ||
      contains(github.event.pull_request.labels.*.name, 'model-download')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      matrix_host: ${{ steps.gen.outputs.matrix_host }}
      matrix_arc: ${{ steps.gen.outputs.matrix_arc }}
    steps:
      - name: Authorize dispatch (repo write/committer level required)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lvl=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" | jq -r '.permission // "none"')
          case "$lvl" in admin|maintain|write) echo "dispatch allowed: ${{ github.actor }} ($lvl)" ;;
            *) echo "::error::需要 write（committer）及以上权限才能手动触发下载（${{ github.actor }}: $lvl）"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request_target：脚本必须来自主仓库默认分支【当前 tip】
          # （event.base.sha 是 PR 创建时的旧 main，不含后续修复，勿用）
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/heads/{0}', github.event.repository.default_branch) || github.sha }}

      - name: Build matrix
        id: gen
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_ORGANIZATION: ${{ inputs.organization }}
          INPUT_MODEL_NAME: ${{ inputs.model_name }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_RD_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_FLATTEN_LEGACY: ${{ inputs.legacy_layout || 'false' }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request_target' && 'origin/main' || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/lib-build-matrix.sh

  download:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix_host != '[]'
    name: ${{ matrix.cluster }} <- ${{ matrix.request }}
    runs-on: ${{ matrix.runner }}
    # 大模型下载不设 6h 默认上限（#151：数百 GB 的 aiframe/mind3 job 被 360min
    # 默认值掐死；self-hosted 上限 3 天）
    timeout-minutes: 4320
    # 同一台同步机上的下载串行排队（共享盘 cache/blobs 不可并发写），不同机器并行
    concurrency:
      group: model-lib-dl-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_host) }}
    env:
      MODELSCOPE_CACHE: ${{ matrix.ms_cache }}
      HF_HOME: ${{ matrix.hf_cache }}
      HUGGINGFACE_HUB_CACHE: ${{ matrix.hf_cache }}/hub
      HF_ENDPOINT: ${{ matrix.hf_endpoint }}
      NODE_CACHE_EXPORT: ${{ matrix.node_cache_export }}
    steps:
      - name: Fetch repo snapshot via codeload (mainland-safe, no github.com git)
        run: |
          if [ '${{ github.event_name }}' = 'pull_request_target' ]; then
            SHA=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/HEAD?sha=${{ github.event.repository.default_branch }}" | jq -r '.sha')
          else
            SHA='${{ github.sha }}'
          fi
          curl -fsSL --retry 4 --retry-delay 5 -m 600 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o /tmp/repo.tgz "https://codeload.github.com/${{ github.repository }}/tar.gz/$SHA"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tgz -C "$GITHUB_WORKSPACE" --strip-components=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure host tooling
        run: |
          if ! command -v jq >/dev/null; then
            if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q jq
            elif command -v dnf >/dev/null; then dnf install -y -q jq
            else yum install -y -q jq; fi
          fi
          PIPFLAGS=""
          pip3 install --help 2>/dev/null | grep -q break-system-packages && PIPFLAGS="--break-system-packages"
          command -v hf >/dev/null || pip3 install -q $PIPFLAGS -i https://mirrors.huaweicloud.com/repository/pypi/simple -U huggingface_hub
          command -v modelscope >/dev/null || pip3 install -q $PIPFLAGS -i https://mirrors.huaweicloud.com/repository/pypi/simple "modelscope==1.37.0"

      - name: Prepare entries
        run: |
          cat > /tmp/req.json <<'REQEOF'
          ${{ matrix.payload }}
          REQEOF
          jq '.models   // []' /tmp/req.json > /tmp/models.json
          jq '.datasets // []' /tmp/req.json > /tmp/datasets.json
          echo "models: $(jq length /tmp/models.json), datasets: $(jq length /tmp/datasets.json)"

      - name: Download models
        if: github.event_name != 'push'
        run: |
          if [ "$(jq length /tmp/models.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/models.json model
          fi

      - name: Download datasets
        if: github.event_name != 'push'
        run: |
          if [ "$(jq length /tmp/datasets.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/datasets.json dataset
          fi

      # 落位断言 + 审计：所有事件都跑。assert 比对写端 caches 与 node_cache.export
      # 读端是否同盘同目录（#132 hk001 全绿但落错兄弟 export 的教训——旧 audit 拿
      # 写端 env 查写端目录必然绿，防不住错位）；audit 查空壳/未落盘。绝不重下。
      - name: Assert landing mount
        run: bash .github/scripts/assert-landing-mount.sh

      - name: Audit landed models
        run: bash .github/scripts/audit-landed.sh

      - name: Upload ledger patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-patch-${{ strategy.job-index }}-${{ matrix.cluster }}
          path: /tmp/models.json
          if-no-files-found: ignore

      - name: Download summary
        if: always()
        run: |
          ok=0 fail=0
          for f in /tmp/dl-counts-model.txt /tmp/dl-counts-dataset.txt; do
            [ -f "$f" ] || continue
            o=$(sed -n 's/^ok=//p' "$f" | head -1); fa=$(sed -n 's/^fail=//p' "$f" | head -1)
            ok=$((ok + ${o:-0})); fail=$((fail + ${fa:-0}))
          done
          {
            echo "### 下载总结:✅ ${ok} 成功 / ❌ ${fail} 失败"
            echo
            echo "明细见上方各批表格;有失败时重跑本 job 即幂等续传(已下 blob 秒过)。"
          } >> "$GITHUB_STEP_SUMMARY"

  # O 卡集群（无同步裸机的 gy001/wlcb001/sh001/sh002）：下载跑在集群内
  # ascend-gha-runners org 级 ARC runner 的 sync-tools 容器里，job pod 已把
  # 本集群共享盘挂成 /root/.cache，写入即落业务容器可读的位置。
  download-arc:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix_arc != '[]'
    name: "[arc] ${{ matrix.cluster }} <- ${{ matrix.request }}"
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/sync-tools:latest
    runs-on: ${{ matrix.runner }}
    # 同 download job：大模型不设 6h 默认上限（#151 教训）
    timeout-minutes: 4320
    # 同一台同步机上的下载串行排队（共享盘 cache/blobs 不可并发写），不同机器并行
    concurrency:
      group: model-lib-dl-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_arc) }}
    env:
      MODELSCOPE_CACHE: ${{ matrix.ms_cache }}
      HF_HOME: ${{ matrix.hf_cache }}
      HUGGINGFACE_HUB_CACHE: ${{ matrix.hf_cache }}/hub
      HF_ENDPOINT: ${{ matrix.hf_endpoint }}
      NODE_CACHE_EXPORT: ${{ matrix.node_cache_export }}
    steps:
      - name: Fetch repo snapshot via codeload (mainland-safe, no github.com git)
        run: |
          if [ '${{ github.event_name }}' = 'pull_request_target' ]; then
            SHA=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/HEAD?sha=${{ github.event.repository.default_branch }}" | jq -r '.sha')
          else
            SHA='${{ github.sha }}'
          fi
          curl -fsSL --retry 4 --retry-delay 5 -m 600 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o /tmp/repo.tgz "https://codeload.github.com/${{ github.repository }}/tar.gz/$SHA"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tgz -C "$GITHUB_WORKSPACE" --strip-components=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure host tooling
        if: false  # sync-tools 镜像自带 jq/hf/modelscope
        run: |
          if ! command -v jq >/dev/null; then
            if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q jq
            elif command -v dnf >/dev/null; then dnf install -y -q jq
            else yum install -y -q jq; fi
          fi
          PIPFLAGS=""
          pip3 install --help 2>/dev/null | grep -q break-system-packages && PIPFLAGS="--break-system-packages"
          command -v hf >/dev/null || pip3 install -q $PIPFLAGS -i https://mirrors.huaweicloud.com/repository/pypi/simple -U huggingface_hub
          command -v modelscope >/dev/null || pip3 install -q $PIPFLAGS -i https://mirrors.huaweicloud.com/repository/pypi/simple "modelscope==1.37.0"

      - name: Prepare entries
        run: |
          cat > /tmp/req.json <<'REQEOF'
          ${{ matrix.payload }}
          REQEOF
          jq '.models   // []' /tmp/req.json > /tmp/models.json
          jq '.datasets // []' /tmp/req.json > /tmp/datasets.json
          echo "models: $(jq length /tmp/models.json), datasets: $(jq length /tmp/datasets.json)"

      - name: Download models
        if: github.event_name != 'push'
        run: |
          if [ "$(jq length /tmp/models.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/models.json model
          fi

      - name: Download datasets
        if: github.event_name != 'push'
        run: |
          if [ "$(jq length /tmp/datasets.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/datasets.json dataset
          fi

      # 落位断言 + 审计：所有事件都跑。assert 比对写端 caches 与 node_cache.export
      # 读端是否同盘同目录（#132 hk001 全绿但落错兄弟 export 的教训——旧 audit 拿
      # 写端 env 查写端目录必然绿，防不住错位）；audit 查空壳/未落盘。绝不重下。
      - name: Assert landing mount
        run: bash .github/scripts/assert-landing-mount.sh

      - name: Audit landed models
        run: bash .github/scripts/audit-landed.sh

      - name: Upload ledger patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-patch-${{ strategy.job-index }}-${{ matrix.cluster }}
          path: /tmp/models.json
          if-no-files-found: ignore

      - name: Download summary
        if: always()
        run: |
          ok=0 fail=0
          for f in /tmp/dl-counts-model.txt /tmp/dl-counts-dataset.txt; do
            [ -f "$f" ] || continue
            o=$(sed -n 's/^ok=//p' "$f" | head -1); fa=$(sed -n 's/^fail=//p' "$f" | head -1)
            ok=$((ok + ${o:-0})); fail=$((fail + ${fa:-0}))
          done
          {
            echo "### 下载总结:✅ ${ok} 成功 / ❌ ${fail} 失败"
            echo
            echo "明细见上方各批表格;有失败时重跑本 job 即幂等续传(已下 blob 秒过)。"
          } >> "$GITHUB_STEP_SUMMARY"

  # Single writer: merges every downloaded entry into model-library/<cluster>.json.
  # dispatch -> pushes to the workflow branch (main); PR -> pushes onto the PR
  # head branch so the ledger lands together with the merge.
  ledger:
    needs: [plan, download, download-arc]
    # 注意 always()：needs 里有 skipped 任务时（纯 host 请求会 skip download-arc，反之亦然），
    # 不带 always() 的 if 会被 GitHub 无条件 skip。
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.download.result == 'success' || needs.download-arc.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "ledger-patch-*"
          path: /tmp/patches
          merge-multiple: false
      - id: apply
        name: Apply patches and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apply_patches() {
            for d in /tmp/patches/ledger-patch-*; do
              cluster=$(basename "$d" | sed 's/^ledger-patch-[0-9]*-//')
              LIB="model-library/$cluster.json"
              mkdir -p "$(dirname "$LIB")"
              [ -f "$LIB" ] || printf '{"models": [], "datasets": []}\n' > "$LIB"
              jq --slurpfile new "$d/models.json" \
                '.models = ((.models + $new[0]) | unique_by(.platform + "/" + .organization + "/" + .model_name))' \
                "$LIB" > /tmp/l.json && mv /tmp/l.json "$LIB"
            done
          }
          apply_patches
          git config user.name "model-library-bot"
          git config user.email "model-library-bot@users.noreply.github.com"
          git add model-library/
          if git diff --cached --quiet; then echo "no ledger changes"; exit 0; fi
          git commit -qm "library: record downloads (${{ github.event_name }} ${{ inputs.organization || github.actor }})"

          IS_FORK='${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}'
          if [ "$IS_FORK" = "true" ]; then
            # fork PR 无法回写其分支。旧方案（推辅助分支+开辅助台账 PR）已退役：
            # 辅助分支重跑 push race（#151 连挂三轮）+ Actions 无建 PR 权限（半自动
            # 设置不可用）使它成为最脆的一环。台账改由每日 ledger-scan 扫盘补录
            # （add-only，≤24h 滞后；"下载完整"的权威记录仍是本 PR 的 download checks）。
            echo "### fork 请求 PR：台账由每日 ledger-scan 补录" >> "$GITHUB_STEP_SUMMARY"
            echo "下载记录见上方 download job；不再推辅助分支/辅助台账 PR。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fi

          TARGET_REF='${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}'
          for i in 1 2 3 4 5; do
            git push -q origin "HEAD:$TARGET_REF" && exit 0
            echo "push race (attempt $i), rebasing onto moved tip" >&2
            git fetch -q origin "$TARGET_REF"
            git reset -q --hard "origin/$TARGET_REF"
            apply_patches
            git add model-library/
            if git diff --cached --quiet; then echo "entries already recorded by concurrent run"; exit 0; fi
            git commit -qm "library: merge ledger after push race"
            sleep $((RANDOM % 4 + 2))
          done
          echo "ledger push failed after retries" >&2
          exit 1

  # 全绿自动合入：带 model-download 标签的请求 PR（入口一），plan/download/ledger
  # 全部成功后由本 job squash-merge，业务方不必再等管理员点合入；fork 请求 PR 的
  # 配套台账 PR 一并自动合入。
  # 安全边界：①标签本身就是人工审批（人工介入点在 label，不在 merge）；
  # ②当前 head 上任何已完成(check)为红则拒绝自动合入；③与 base 冲突(dirty)不合；
  # ④本工作流自身仍在途的 job 不算阻塞（避免等待自己造成死锁），外部工作流的
  #   在途 checks 最多等 15 分钟，超条件即留给人工。
  merge:
    needs: [plan, download, download-arc, ledger]
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'model-download') &&
      needs.plan.result == 'success' &&
      (needs.download.result == 'success' || needs.download-arc.result == 'success') &&
      needs.ledger.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Squash-merge when checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          merge_when_ready() { # $1=PR号  $2=最长等待秒
            local pr="$1" budget="$2" t=0 info merged rest state sha ms crs fails pend blocking n
            while [ "$t" -lt "$budget" ]; do
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '[.merged,.state,.head.sha,.mergeable_state]|@tsv' 2>/dev/null) \
                || { sleep 15; t=$((t+15)); continue; }
              merged=${info%%$'\t'*}; rest=${info#*$'\t'}
              state=${rest%%$'\t'*};   rest=${rest#*$'\t'}
              sha=${rest%%$'\t'*};     ms=${rest#*$'\t'}
              if [ "$merged" = "true" ]; then echo "PR #$pr already merged"; return 0; fi
              if [ "$state" != "open" ]; then echo "::warning::PR #$pr state=$state, 跳过自动合入"; return 1; fi
              if [ "$ms" = "dirty" ]; then echo "::error::PR #$pr 与 base 冲突，请 rebase 后重试"; return 1; fi
              crs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate \
                    --jq '.check_runs[]|[.name,.status,.conclusion]|@tsv' 2>/dev/null) || crs=""
              fails=$(printf '%s\n' "$crs" | awk -F'\t' '$2=="completed" && $3!="success" && $3!="skipped" && $3!="neutral" && $3!="" {print $1}' | sort -u | paste -sd, -)
              if [ -n "$fails" ]; then echo "::error::PR #$pr head $sha 存在失败检查: $fails，不自动合入"; return 1; fi
              pend=$(printf '%s\n' "$crs" | awk -F'\t' '$2!="completed" {print $1}' | sort -u)
              blocking=""
              while IFS= read -r n; do
                [ -z "$n" ] && continue
                case "$n" in
                  plan|ledger|merge) ;;      # 本工作流自身（含正在跑的 merge job）
                  *" <- "*) ;;               # download / [arc] download job 名格式 "<cluster> <- <req>"
                  *) blocking="$blocking $n" ;;
                esac
              done <<< "$pend"
              if [ -n "${blocking// /}" ]; then echo "等待外部检查完成:$blocking (${t}s)"; sleep 15; t=$((t+15)); continue; fi
              if [ "$ms" = "clean" ] || [ "$ms" = "behind" ] || [ "$ms" = "has_hooks" ]; then
                if gh pr merge "$pr" --repo "$REPO" --squash; then echo "merged PR #$pr (sha=$sha ms=$ms)"; return 0; fi
                if [ "$(gh api "repos/$REPO/pulls/$pr" --jq .merged 2>/dev/null)" = "true" ]; then echo "PR #$pr 已被并发合入"; return 0; fi
                echo "merge 调用失败（可能 head 刚移动），重试"
              else
                echo "mergeable_state=$ms，等待重算"; sleep 10; t=$((t+10))
              fi
              sleep 15; t=$((t+15))
            done
            echo "::warning::PR #$pr 未自动合入（超时或条件未满足），请管理员手动处理"
            return 1
          }
          rc=0
          merge_when_ready "$PR" 900 || rc=1
          exit $rc
