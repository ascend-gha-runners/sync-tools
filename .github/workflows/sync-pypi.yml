name: sync pypi packages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/config/pypi-sync.json"
      - ".github/workflows/sync-pypi.yml"
      - ".github/scripts/sync-pypi.py"

concurrency:
  group: sync-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync PyPI packages to Ascend mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install esdk-obs-python

      - name: Sync packages
        env:
          HW_AK: ${{ secrets.HW_AK }}
          HW_SK: ${{ secrets.HW_SK }}
        run: python .github/scripts/sync-pypi.py
