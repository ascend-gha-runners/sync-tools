name: model library

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "业务仓库（需在 config/repos.json 中登记）"
        required: true
        default: "vllm-project/vllm-ascend"
      machine:
        description: "机器型号：a2 / a3 / a3-800i / a3-800t（决定下载到哪几个集群）"
        required: true
        default: "a3-800i"
      platform:
        description: "下载源"
        type: choice
        required: true
        default: modelscope
        options: [modelscope, huggingface]
      organization:
        description: "模型组织，如 Qwen / vllm-sr"
        required: true
      model_name:
        description: "模型名，如 d3-edge"
        required: true
      revision:
        description: "分支/commit（留空=默认）"
        required: false
        default: ""
      flatten_legacy:
        description: "modelscope：额外平铺到 hub/models/<org>/<name> 旧布局"
        type: boolean
        required: false
        default: true
      requires_auth:
        description: "私有模型：使用仓库 secrets 中的 HF_TOKEN / MODELSCOPE_SDK_TOKEN"
        type: boolean
        required: false
        default: false
      runner_label:
        description: "【推荐】你的 runner 标签（从自己 workflow 的 runs-on 抄）；填了就自动识别所在集群，repo/machine 可留空"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - "model-library/**"
      - ".github/workflows/model-library.yml"
      - ".github/scripts/lib-build-matrix.sh"
      - ".github/scripts/download-json-models.sh"

# NOTE: no top-level `permissions:` block — GITHUB_TOKEN needs default
# (permissive) read scopes so the dispatch authorization can query the
# collaborators API; jobs grant `contents: write` only where needed.

concurrency:
  group: model-library-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('dispatch-{0}-{1}', inputs.repo, inputs.model_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  label-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.runner_label != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allowlist runner label against registry patterns
        run: |
          L='${{ inputs.runner_label }}'
          jq -e --arg l "$L" 'to_entries[] | select(.value.match.label_regex as $re | $re != null and ($l | test($re)))' \
            model-library/clusters.json >/dev/null || {
              echo "::error::runner 标签 \"$L\" 不属于任何已登记集群的标签模式；请改用 仓库+机型 模式，或让管理员补充 model-library/clusters.json 的 match 字段"; exit 1; }
          echo "label allowed"

  identify:
    needs: label-guard
    if: github.event_name == 'workflow_dispatch' && inputs.runner_label != '' && needs.label-guard.result == 'success'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 15
    outputs:
      clusters: ${{ steps.probe.outputs.clusters }}
    steps:
      - name: Fetch repo snapshot via codeload
        run: |
          curl -fsSL --retry 4 --retry-delay 5 -m 600 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o /tmp/repo.tgz "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tgz -C "$GITHUB_WORKSPACE" --strip-components=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe runner environment
        id: probe
        run: bash .github/scripts/runner-probe.sh model-library/clusters.json

  plan:
    # PRs must carry the "model-download" label to trigger downloads;
    # fork PRs are skipped (self-hosted runners must not run fork code).
    needs: [label-guard, identify]
    if: >-
      !cancelled() &&
      needs.label-guard.result != 'failure' &&
      needs.identify.result != 'failure' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'model-download')))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Authorize dispatch (repo write/committer level required)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lvl=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" | jq -r '.permission // "none"')
          case "$lvl" in admin|maintain|write) echo "dispatch allowed: ${{ github.actor }} ($lvl)" ;;
            *) echo "::error::需要 write（committer）及以上权限才能手动触发下载（${{ github.actor }}: $lvl）"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build matrix
        id: gen
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_MACHINE: ${{ inputs.machine }}
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label }}
          INPUT_MODEL_NAME: ${{ inputs.model_name }}
          INPUT_DETECTED: ${{ needs.identify.outputs.clusters }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/lib-build-matrix.sh

  download:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    permissions:
      contents: write
    name: ${{ inputs.model_name || matrix.cluster }} -> ${{ matrix.cluster }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Fetch repo snapshot via codeload (mainland-safe, no github.com git)
        run: |
          SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          curl -fsSL --retry 4 --retry-delay 5 -m 600 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o /tmp/repo.tgz "https://codeload.github.com/${{ github.repository }}/tar.gz/$SHA"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tgz -C "$GITHUB_WORKSPACE" --strip-components=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure host tooling
        run: |
          command -v jq >/dev/null || { apt-get update -q && apt-get install -y -q jq; }
          command -v hf >/dev/null || pip3 install --break-system-packages -q -U huggingface_hub
          command -v modelscope >/dev/null || pip3 install --break-system-packages -q "modelscope==1.37.0"  # last classic hub/models layout release; 1.38+ switched to models/<org>--<name>/snapshots

      - name: Prepare entries
        run: |
          if [ -n '${{ matrix.library }}' ]; then
            CFG='${{ github.workspace }}/${{ matrix.library }}'
            if [ -f "$CFG" ]; then
              jq '.models   // []' "$CFG" > /tmp/models.json
              jq '.datasets // []' "$CFG" > /tmp/datasets.json
            else
              echo "no ledger for ${{ matrix.cluster }} yet; nothing to sync"
              echo '[]' > /tmp/models.json; echo '[]' > /tmp/datasets.json
            fi
          else
            jq -n \
              --arg platform "${{ inputs.platform }}" \
              --arg org "${{ inputs.organization }}" \
              --arg name "${{ inputs.model_name }}" \
              --arg rev "${{ inputs.revision }}" \
              --argjson legacy "${{ inputs.flatten_legacy || 'false' }}" \
              '{models: [({platform: $platform, organization: $org, model_name: $name}
                          + (if $rev == "" then {} else {revision: $rev} end)
                          + (if $platform == "modelscope" and $legacy then {legacy_layout: true} else {} end))],
                datasets: []}' > /tmp/all.json
            jq '.models'   /tmp/all.json > /tmp/models.json
            jq '.datasets' /tmp/all.json > /tmp/datasets.json
          fi
          echo "models: $(jq length /tmp/models.json), datasets: $(jq length /tmp/datasets.json)"

      - name: Download models
        env:
          MODELSCOPE_CACHE: ${{ matrix.ms_cache }}
          HF_HOME: ${{ matrix.hf_cache }}
          HUGGINGFACE_HUB_CACHE: ${{ matrix.hf_cache }}/hub
          HF_ENDPOINT: ${{ matrix.hf_endpoint }}
          HF_TOKEN: ${{ github.event.inputs.requires_auth == 'true' && secrets.HF_TOKEN || '' }}
          MODELSCOPE_SDK_TOKEN: ${{ github.event.inputs.requires_auth == 'true' && secrets.MODELSCOPE_SDK_TOKEN || '' }}
        run: |
          if [ "$(jq length /tmp/models.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/models.json model
          fi

      - name: Download datasets
        env:
          MODELSCOPE_CACHE: ${{ matrix.ms_cache }}
          HF_HOME: ${{ matrix.hf_cache }}
          HUGGINGFACE_HUB_CACHE: ${{ matrix.hf_cache }}/hub
          HF_ENDPOINT: ${{ matrix.hf_endpoint }}
          HF_TOKEN: ${{ github.event.inputs.requires_auth == 'true' && secrets.HF_TOKEN || '' }}
          MODELSCOPE_SDK_TOKEN: ${{ github.event.inputs.requires_auth == 'true' && secrets.MODELSCOPE_SDK_TOKEN || '' }}
        run: |
          if [ "$(jq length /tmp/datasets.json)" -gt 0 ]; then
            bash .github/scripts/download-json-models.sh /tmp/datasets.json dataset
          fi

      - name: Record dispatch entry for the library PR
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          {
            echo "#### ${{ matrix.cluster }}"
            echo
            echo '下载条目（已自动登记进模型库台账）：'
            echo '```json'
            jq -c '.[]' /tmp/models.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ledger patch
        if: github.event_name == 'workflow_dispatch' && inputs.model_name != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-patch-${{ matrix.cluster }}
          path: /tmp/models.json
          if-no-files-found: ignore

  # Single writer for ledger updates, on a hosted runner where github.com git
  # is reliable; mainland host runners only upload patch artifacts.
  ledger:
    needs: download
    if: github.event_name == 'workflow_dispatch' && needs.download.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "ledger-patch-*"
          path: /tmp/patches
          merge-multiple: false
      - name: Apply patches and push
        run: |
          changed=0
          for d in /tmp/patches/ledger-patch-*; do
            cluster=$(basename "$d" | sed 's/ledger-patch-//')
            LIB="model-library/$cluster.json"
            mkdir -p "$(dirname "$LIB")"
            [ -f "$LIB" ] || printf '{"models": [], "datasets": []}\n' > "$LIB"
            jq --slurpfile new "$d/models.json" \
              '.models = ((.models + $new[0]) | unique_by(.platform + "/" + .organization + "/" + .model_name))' \
              "$LIB" > /tmp/l.json
            cmp -s /tmp/l.json "$LIB" || { mv /tmp/l.json "$LIB"; changed=1; }
          done
          [ "$changed" = 1 ] || { echo "no ledger changes"; exit 0; }
          git config user.name "model-library-bot"
          git config user.email "model-library-bot@users.noreply.github.com"
          git add model-library/
          git commit -m "library: register dispatch downloads (${{ inputs.organization }}/${{ inputs.model_name }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
