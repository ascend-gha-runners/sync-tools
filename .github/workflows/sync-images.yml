name: Sync Images Between Registries

on:
  workflow_dispatch:
  schedule:
      - cron: "23 * * * *"

jobs:
  prepare:
    name: Prepare sync matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          matrix=$(jq -c '[.[].src] | unique | map({src: .})' .github/workflows/config/image-sync.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
        id: set-matrix

  sync:
    name: Sync ${{ matrix.src }}
    needs: prepare
    runs-on: ubuntu-latest
    # 并发控制在 job 级按 src 分组：某个慢源（如 verl/vllm-ascend 同步 2h+）只会延迟
    # 它自己的下一次同步，不会把整个 run 拖住、连坐其他镜像的同步节奏。
    # 不要提升回 workflow 级——那会让所有 src 一起等最慢的那个。
    # 组 key 故意不带 github.ref：任何 ref 写的都是同一批 dest registry，跨 ref 的同
    # src 同样必须互斥，否则「同 src 不并发」在分支手动 dispatch 时会被绕过；
    # 代价是在分支上手动跑同一 src 时要排队等 main 的 job 结束。
    # 另外注意：默认 queue: single 下，被更新的 pending 顶掉的 job 会以 cancelled 收场
    # （正常替换，非失败）；若对 cancelled run 有告警，需排除这类情况以免误报。
    concurrency:
      group: sync-images-${{ matrix.src }}
      cancel-in-progress: false
    container:
      image: quay.io/skopeo/stable:latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # job 级 180 是兜底（防同步步骤吞掉 SIGINT）；真正的超时控制在同步步骤
    # 自身的 170——step 级超时只取消该步，后续 if: always() 的缓存 save
    # 一定执行（不依赖 job 取消后 always() 的语义），缓存进度不丢。
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: microdnf install -y jq curl

      - name: Restore digest cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/digest-cache
          key: digest-cache-${{ matrix.src }}#${{ github.run_id }}
          # 依次前缀回退：先命中 # 新格式条目；没有再回退旧 `-` 格式条目（#153 迁移前
          # 保存的），避免格式迁移/缓存重建触发 docker.io 全量重推（重推会刷新 Docker
          # Hub last_updated 时间戳，用户会误以为镜像被改动）。
          # 分隔符 # 是 src 字符集（字母数字 . - / _）里不会出现的字符：src 之间可能
          # 互为字符串前缀（mindie / mindie-motor / mindiesd），用 - 会串到别的 src 的
          # 缓存归档。旧格式回退对 mindie 可能取错归档，但文件名对不上会回落空缓存，
          # 再由同步步骤的 dest 实时兜底（见下），不会重推。
          restore-keys: |
            digest-cache-${{ matrix.src }}#
            digest-cache-${{ matrix.src }}-

      - name: Sync ${{ matrix.src }} to all destinations
        env:
          QUAY_ASCEND_USER: ${{ vars.QUAY_ASCEND_USER }}
          QUAY_ASCEND_PWD: ${{ secrets.QUAY_ASCEND_PWD }}
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_PWD: ${{ secrets.DOCKERHUB_PWD }}
          DOCKERHUB_PAGE_CAP: ${{ vars.DOCKERHUB_PAGE_CAP }}
          HWCLOUD_USER: ${{ vars.HWCLOUD_USER }}
          HWCLOUD_PWD: ${{ secrets.HWCLOUD_PWD }}
          SWR_EAST3_USER: ${{ vars.SWR_EAST3_USER }}
          SWR_EAST3_SECRET: ${{ secrets.SWR_EAST3_SECRET }}
          SWR_HK_USER: ${{ vars.REGISTRY_HK_USER }}
          SWR_HK_SECRET: ${{ secrets.SWR_HK_SECRET }}
          SWR_NORTH12_USER: ${{ vars.SWR_NORTH12_USER }}
          SWR_NORTH12_SECRET: ${{ secrets.SWR_NORTH12_SECRET }}
          SWR_NORTH4_USER: ${{ vars.SWR_NORTH4_USER }}
          SWR_NORTH4_SECRET: ${{ secrets.SWR_NORTH4_SECRET }}
          QUAY_ATLAS_INFERENCE_USER: ${{ vars.QUAY_ATLAS_INFERENCE_USER }}
          QUAY_ATLAS_INFERENCE_PWD: ${{ secrets.QUAY_ATLAS_INFERENCE_PWD }}
          CURRENT_SRC: ${{ matrix.src }}
        timeout-minutes: 170
        run: bash .github/scripts/sync-images.sh

      - name: Save digest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/digest-cache
          # 带 run_attempt：同一 run 被 re-run 时 key 不同，避免 save 撞 already exists
          key: digest-cache-${{ matrix.src }}#${{ github.run_id }}-${{ github.run_attempt }}
